  &lt;script&gt;
    /**
     * LIVING BOTANICAL RIBBON MEADOW — ULTRA-SOFT LUSH EDITION
     *
     * Inspired by the lush, sweeping softness of a tall meadow in motion while preserving
     * the vivid violet -&gt; magenta -&gt; hot pink -&gt; coral-red botanical ribbon aesthetic:
     * 1. 14,400 SUPPLE, ARCHING RIBBONS:
     *    - Rendered at 60fps via WebGL2 hardware instancing with 22 smooth subdivisions per blade.
     *    - Arranged in 120 deeply stratified Y-sorted layers from top to bottom so foreground rows
     *      naturally overlap the deep-violet rooted bases of background rows.
     *    - Instead of stiff vertical planks, every ribbon features a graceful, continuous cubic Bezier
     *      arch, natural gravitational droop, and supple tip flexibility.
     * 2. COHESIVE ROLLING WIND STREAMS:
     *    - Multi-octave simplex/harmonic wind waves sweep across the field in organic streams,
     *      causing neighboring ribbons to arch together into flowing currents of light and shadow.
     * 3. SILKY 2D FLUID-SPRING INTERACTION TEXTURE:
     *    - A dedicated high-resolution spring-damped velocity &amp; displacement field tracks mouse
     *      and touch caresses with inertia, wave propagation, and curl.
     *    - Brushing the meadow parts and sweeps the ribbons like running your hand through long,
     *      silky grass, creating supple C-arches and whip-like S-curves that gently sigh back into place.
     */

    (function () {
      const canvas = document.getElementById(&#x27;meadow&#x27;);
      const gl = canvas.getContext(&#x27;webgl2&#x27;, {
        alpha: false,
        antialias: true,
        powerPreference: &#x27;high-performance&#x27;,
        preserveDrawingBuffer: false
      });

      if (!gl) {
        document.body.style.background = &#x27;linear-gradient(to top, #1a0633, #9b1368, #ff385c)&#x27;;
        return;
      }

      // -------------------------------------------------------------------------
      // 1. SHADERS — CUBIC BEZIER SUPPLE RIBBON SPLINES &amp; VELVETY SHADING
      // -------------------------------------------------------------------------
      const vsSource = `#version 300 es
      precision highp float;

      // aStrip.x: [-0.5, 0.5] across ribbon width
      // aStrip.y: [0.0, 1.0] normalized distance along ribbon spine (22 smooth segments)
      layout(location = 0) in vec2 aStrip;

      // Static per-instance attributes (4 vec2/vec4 packed):
      // aRootAndSize: x = normRootX, y = normRootY, z = lengthScale, w = widthScale
      // aTraits:      x = naturalLean, y = flexibility, z = phase, w = stratumAndTone
      layout(location = 1) in vec4 aRootAndSize;
      layout(location = 2) in vec4 aTraits;

      uniform vec2 uResolution;
      uniform float uTime;
      uniform sampler2D uInteractionTex; // RG = smoothed displacement (dx, dy), B = trail velocity curl/S-whip, A = affection glow

      out float vProgress;
      out float vAcross;
      out float vStratum;
      out float vToneShift;
      out float vWindCatch;
      out float vAffection;
      out float vTangentX;

      // Smooth 2D value/gradient noise for cohesive rolling meadow wind currents
      vec2 hash22(vec2 p) {
        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
        return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
      }

      float simplexNoise(vec2 p) {
        const float K1 = 0.366025404; // (sqrt(3)-1)/2
        const float K2 = 0.211324865; // (3-sqrt(3))/6
        vec2 i = floor(p + (p.x + p.y) * K1);
        vec2 a = p - i + (i.x + i.y) * K2;
        vec2 o = (a.x &gt; a.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec2 b = a - o + K2;
        vec2 c = a - 1.0 + 2.0 * K2;
        vec3 h = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
        vec3 n = h * h * h * h * vec3(
          dot(a, hash22(i + 0.0)),
          dot(b, hash22(i + o)),
          dot(c, hash22(i + 1.0))
        );
        return dot(n, vec3(70.0));
      }

      // Evaluate smooth Cubic Bezier spine (P0=0, P1, P2, P3) and exact analytical tangent
      void evaluateCubicBezier(
        float t,
        vec2 p1, vec2 p2, vec2 p3,
        out vec2 pos, out vec2 tangent
      ) {
        float u = 1.0 - t;
        float u2 = u * u;
        float u3 = u2 * u;
        float t2 = t * t;
        float t3 = t2 * t;

        // P0 is vec2(0.0) at root
        pos = 3.0 * u2 * t * p1
            + 3.0 * u * t2 * p2
            + t3 * p3;

        // Exact derivative dP/dt
        vec2 dPos = 3.0 * u2 * p1
                  + 6.0 * u * t * (p2 - p1)
                  + 3.0 * t2 * (p3 - p2);

        float len = max(length(dPos), 0.0001);
        tangent = dPos / len;
      }

      void main() {
        float s = aStrip.y;
        float side = aStrip.x;

        vec2 normRoot = aRootAndSize.xy;
        vec2 rootPx = normRoot * uResolution;

        float minDim = min(uResolution.x, uResolution.y);
        float globalScale = clamp(minDim / 950.0, 0.72, 1.45);

        float bladeLen = aRootAndSize.z * globalScale;
        float baseWidth = aRootAndSize.w * globalScale;

        float naturalLean = aTraits.x;
        float flex = aTraits.y;
        float phase = aTraits.z;
        float packedStratum = aTraits.w;
        float stratum = floor(packedStratum) * 0.5; // 0.0, 0.5, 1.0
        float toneShift = fract(packedStratum) * 2.0 - 1.0;

        // ---------------------------------------------------------------------
        // 1. COHESIVE ROLLING MEADOW WIND WAVES (Multi-octave organic flow)
        // ---------------------------------------------------------------------
        // Aspect-corrected spatial coordinates for natural wind wave streams
        vec2 aspectPos = vec2(normRoot.x * (uResolution.x / max(uResolution.y, 1.0)), normRoot.y);

        // Primary sweeping wind swell across the meadow (creates the lush streaming groups in the reference)
        float swell1 = simplexNoise(aspectPos * 2.1 - vec2(uTime * 0.24, uTime * 0.11));
        // Secondary undulating gust ripples
        float swell2 = simplexNoise(aspectPos * 4.6 - vec2(uTime * 0.42, -uTime * 0.16) + phase * 0.18);
        // Delicate individual flutter at the tips
        float microFlutter = sin(uTime * 1.9 + phase + normRoot.x * 9.0) * 0.08;

        // Combined wind angle: cohesive streams that gently arch the blades like soft tall grass
        float ambientBreeze = (swell1 * 0.46 + swell2 * 0.24 + microFlutter) * flex;

        // Natural soft resting arch (blends individual poise with cohesive local meadow stream)
        float streamLean = naturalLean * 0.65 + swell1 * 0.28;
        float totalWindAngle = streamLean + ambientBreeze;

        // ---------------------------------------------------------------------
        // 2. SAMPLE FLUID-SPRING INTERACTION FIELD AT ROOT AND MID-BLADE
        // ---------------------------------------------------------------------
        // Sample both near the base/mid and near the upper canopy so brushing across a ribbon
        // bends its lower body and whips its tip into supple C-curves and S-curves
        vec2 uvRoot = clamp(normRoot, 0.002, 0.998);
        vec2 uvUpper = clamp(normRoot + vec2(sin(totalWindAngle) * 0.04, 0.085), 0.002, 0.998);

        vec4 fieldBase  = texture(uInteractionTex, uvRoot);
        vec4 fieldUpper = texture(uInteractionTex, uvUpper);

        // Decode interaction vectors (stored in [-1..1] normalized range in float/half-float or unpacked)
        vec2 brushBase  = fieldBase.xy;
        vec2 brushUpper = fieldUpper.xy;
        float whipCurl  = fieldUpper.z; // S-curve whip/lag component from stroke velocity
        float affection = clamp(max(fieldBase.w, fieldUpper.w), 0.0, 1.0);

        // ---------------------------------------------------------------------
        // 3. ARTICULATED 4-NODE CUBIC BEZIER SOFT CANTILEVER
        // ---------------------------------------------------------------------
        // Instead of a rigid bar, the 3 control angles (theta1, theta2, theta3) progressively
        // droop and flex from root to tip:
        // - theta1 (lower 1/3): anchored, gentle lean + lower brush push
        // - theta2 (mid 2/3):   graceful arch + strong brush sweep
        // - theta3 (tip 3/3):   supple gravitational droop + fluid follow-through / S-curve whip

        float brushAngle1 = brushBase.x * 0.95 * flex;
        float brushAngle2 = (brushBase.x * 0.45 + brushUpper.x * 1.15) * flex;
        // Tip experiences extra supple bend + whip curl for organic S-shapes and C-arches
        float brushAngle3 = (brushUpper.x * 1.55 + whipCurl * 0.85) * flex;

        // Vertical brushing (stroking up or down) compresses or lifts the arch softly
        float verticalPress = clamp((brushBase.y + brushUpper.y) * 0.35, -0.45, 0.35);

        float theta1 = totalWindAngle * 0.38 + brushAngle1;
        float theta2 = totalWindAngle * 0.82 + brushAngle2;
        // Natural gravitational tip droop: when a blade leans, its soft tip arches further over
        float tipDroop = totalWindAngle * 1.32 + sign(totalWindAngle) * (totalWindAngle * totalWindAngle) * 0.28;
        float theta3 = tipDroop + brushAngle3;

        // Soft angle clamping so blades stay silky and never kink
        theta1 = clamp(theta1, -1.15, 1.15);
        theta2 = clamp(theta2, -1.42, 1.42);
        theta3 = clamp(theta3, -1.62, 1.62);

        // Inextensible segment length (preserves ribbon arc length while flexing)
        float segLen = (bladeLen * 0.3333) * (1.0 + verticalPress * 0.18);

        vec2 p1 = vec2(sin(theta1), cos(theta1)) * segLen;
        vec2 p2 = p1 + vec2(sin(theta2), cos(theta2)) * segLen;
        vec2 p3 = p2 + vec2(sin(theta3), cos(theta3)) * segLen;

        vec2 spineOffset;
        vec2 tangent;
        evaluateCubicBezier(s, p1, p2, p3, spineOffset, tangent);

        // Perpendicular normal for ribbon width extrusion
        vec2 normal = vec2(-tangent.y, tangent.x);

        // ---------------------------------------------------------------------
        // 4. SUPPLE BOTANICAL RIBBON PROFILE (Soft Tapered Ribbon, Not Rigid Bar)
        // ---------------------------------------------------------------------
        // Full, lush ribbon width through the lower and middle body that gracefully
        // softens and narrows toward the tip so overlapping layers look organic and velvety
        float widthProfile = mix(1.0, 0.36, pow(s, 1.65)) * smoothstep(1.0, 0.965, s);

        // Subtle 3D foreshortening when a ribbon twists in the wind, making it feel like soft fabric/foliage
        float twistNarrowing = 1.0 - 0.18 * clamp(abs(tangent.x) * s, 0.0, 1.0);
        float currentWidth = baseWidth * widthProfile * twistNarrowing;

        vec2 worldPx = rootPx + spineOffset + normal * (side * currentWidth);
        vec2 clipPos = (worldPx / uResolution) * 2.0 - 1.0;

        gl_Position = vec4(clipPos, 0.0, 1.0);

        vProgress = s;
        vAcross = side * 2.0; // [-1.0 .. 1.0]
        vStratum = stratum;
        vToneShift = toneShift;
        // Catch-light when wind or brush arches the blade (creates sweeping sheen waves across the meadow)
        vWindCatch = clamp(swell1 * 0.5 + swell2 * 0.35 + abs(brushUpper.x) * 0.6, -1.0, 1.0);
        vAffection = affection;
        vTangentX = tangent.x;
      }
      `;

      const fsSource = `#version 300 es
      precision highp float;

      in float vProgress;
      in float vAcross;
      in float vStratum;
      in float vToneShift;
      in float vWindCatch;
      in float vAffection;
      in float vTangentX;

      out vec4 fragColor;

      void main() {
        float s = vProgress;

        // 1. LUSH BOTANICAL RIBBON GRADIENT (Deep Indigo/Violet Base -&gt; Magenta -&gt; Hot Pink -&gt; Coral Tip)
        float g = clamp(s + vToneShift * 0.055 + vWindCatch * 0.04 * s, 0.0, 1.0);

        vec3 cDeepRoot = vec3(0.120, 0.020, 0.205); // Deepest meadow shadow violet
        vec3 cLower    = vec3(0.380, 0.055, 0.440); // Rich plum-violet
        vec3 cMid      = vec3(0.735, 0.095, 0.465); // Velvety magenta-crimson
        vec3 cUpper    = vec3(0.915, 0.145, 0.435); // Vivid hot pink
        vec3 cTip      = vec3(0.975, 0.255, 0.275); // Luminous coral red

        vec3 col;
        if (g &lt; 0.24) {
          col = mix(cDeepRoot, cLower, smoothstep(0.0, 0.24, g));
        } else if (g &lt; 0.54) {
          col = mix(cLower, cMid, smoothstep(0.24, 0.54, g));
        } else if (g &lt; 0.80) {
          col = mix(cMid, cUpper, smoothstep(0.54, 0.80, g));
        } else {
          col = mix(cUpper, cTip, smoothstep(0.80, 1.0, g));
        }

        // 2. SOFT VELVETY CEL-SHADING &amp; CURVATURE CATCH-LIGHT
        // Just like sunlight glinting off arched grass blades in the reference photo,
        // the upper/convex edge of an arching ribbon catches a warm, soft cel-shaded sheen.
        float archLight = vAcross * vTangentX;
        float softHighlight = smoothstep(-0.05, 0.38, archLight) * (0.14 + 0.10 * s);
        float softCoreShade = smoothstep(-0.05, 0.42, -archLight) * 0.13;

        // Subtle cylindrical / satin volume across the ribbon width so it feels soft and tactile, never flat/rigid
        float satinCurve = 1.0 - 0.10 * (vAcross * vAcross);

        vec3 sheenColor = vec3(1.0, 0.48, 0.52);
        col = col * satinCurve + sheenColor * softHighlight - vec3(0.16, 0.03, 0.20) * softCoreShade;

        // 3. SWEEPING WIND WAVE ILLUMINATION (Clusters of blades catching light as wind rolls over)
        float waveSheen = max(0.0, vWindCatch) * pow(s, 1.35) * 0.18;
        col += vec3(0.98, 0.36, 0.42) * waveSheen;

        // 4. DEEP STRATIFIED MEADOW OCCLUSION
        // Ground the base of every blade deeply into the dark-violet undergrowth so the 120 rows
        // fuse into a continuous, deeply layered meadow rather than separate floating shapes.
        float rootAO = smoothstep(0.0, 0.34, s);
        col = mix(vec3(0.095, 0.016, 0.155), col, 0.18 + 0.82 * rootAO);

        // Depth stratum layering (background undergrowth is darker, foreground canopy is luminous)
        float stratumLum = mix(0.68, 1.06, vStratum);
        col *= stratumLum;

        // 5. AFFECTIONATE CARESS GLOW
        // When stroked, ribbons warm up with a soft coral-rose luminescence along their flexed curves
        vec3 caressGlow = mix(vec3(0.94, 0.20, 0.54), vec3(1.0, 0.42, 0.36), s);
        col = mix(col, max(col, caressGlow * stratumLum * 1.08), vAffection * 0.38 * rootAO);

        // Silky anti-aliased ribbon silhouette
        float edgeAlpha = 1.0 - smoothstep(0.86, 1.0, abs(vAcross));
        // Softly round the very tip cap so it feels organic and supple
        float tipAlpha = 1.0 - smoothstep(0.975, 1.0, s) * smoothstep(0.45, 0.95, abs(vAcross));

        fragColor = vec4(clamp(col, 0.0, 1.0), edgeAlpha * tipAlpha);
      }
      `;

      function compileShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error(gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      }

      const vs = compileShader(gl.VERTEX_SHADER, vsSource);
      const fs = compileShader(gl.FRAGMENT_SHADER, fsSource);
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);

      const uResolutionLoc = gl.getUniformLocation(program, &#x27;uResolution&#x27;);
      const uTimeLoc = gl.getUniformLocation(program, &#x27;uTime&#x27;);
      const uInteractionTexLoc = gl.getUniformLocation(program, &#x27;uInteractionTex&#x27;);

      // -------------------------------------------------------------------------
      // 2. HIGH-SUBDIVISION RIBBON STRIP GEOMETRY (22 SMOOTH SEGMENTS)
      // -------------------------------------------------------------------------
      const SEGMENTS = 22;
      const stripVertCount = (SEGMENTS + 1) * 2;
      const stripVertices = new Float32Array(stripVertCount * 2);

      let vPtr = 0;
      for (let i = 0; i &lt;= SEGMENTS; i++) {
        const s = i / SEGMENTS;
        stripVertices[vPtr++] = -0.5;
        stripVertices[vPtr++] = s;
        stripVertices[vPtr++] = 0.5;
        stripVertices[vPtr++] = s;
      }

      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);

      const stripBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, stripBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, stripVertices, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

      // -------------------------------------------------------------------------
      // 3. DENSE STRATIFIED MEADOW GENERATION (14,400 Y-SORTED RIBBONS)
      // -------------------------------------------------------------------------
      // 120 horizontal rows from top to bottom x 120 ribbons per row = 14,400 lush ribbons
      const ROWS = 120;
      const COLS = 120;
      const RIBBON_COUNT = ROWS * COLS;
      const FLOATS_PER_INSTANCE = 8; // aRootAndSize (vec4) + aTraits (vec4)
      const instanceData = new Float32Array(RIBBON_COUNT * FLOATS_PER_INSTANCE);

      let seed = 1357911;
      function rand() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }

      // Smooth spatial hash for natural clumping &amp; sweeping orientation streams (like real tall grass)
      function streamNoise(x, y) {
        return Math.sin(x * 5.2 + y * 3.4) * 0.5 + Math.cos(x * 2.7 - y * 6.1) * 0.5;
      }

      function buildStratifiedMeadow() {
        let ptr = 0;
        for (let r = 0; r &lt; ROWS; r++) {
          // Strict back-to-front ordering:
          // Row 0 is above the top edge (y = 1.06), Row 119 is below the bottom edge (y = -0.22)
          const rowFrac = r / (ROWS - 1);
          const baseRowY = 1.06 - rowFrac * 1.28;

          for (let c = 0; c &lt; COLS; c++) {
            const colFrac = (c + 0.5) / COLS;

            // Organic jitter within each stratified band
            const jx = (rand() - 0.5) * (1.8 / COLS);
            const jy = (rand() - 0.5) * (0.95 / ROWS);

            const nx = -0.08 + colFrac * 1.16 + jx;
            const ny = baseRowY + jy;

            // 3 interleaved depth strata within each row (0 = deep undergrowth, 1 = mid meadow, 2 = lush canopy)
            const stratum = (c * 5 + r * 3) % 3;
            const toneRandom = rand() * 0.98;

            // Tall, overlapping, graceful blade lengths and supple widths
            const lengthScale = 155.0 + rand() * 80.0 + stratum * 18.0;
            const widthScale  = 11.5 + rand() * 6.0 + stratum * 1.4;

            // Cohesive natural arch/lean so neighboring blades flow together like the reference meadow
            const localStream = streamNoise(nx, ny);
            const naturalLean = localStream * 0.34 + (rand() - 0.5) * 0.24;

            // High flexibility so every blade bends and droops softly
            const flexibility = 0.85 + rand() * 0.42;
            const phase = rand() * Math.PI * 2.0;

            instanceData[ptr++] = nx;
            instanceData[ptr++] = ny;
            instanceData[ptr++] = lengthScale;
            instanceData[ptr++] = widthScale;

            instanceData[ptr++] = naturalLean;
            instanceData[ptr++] = flexibility;
            instanceData[ptr++] = phase;
            instanceData[ptr++] = stratum + toneRandom;
          }
        }
      }

      buildStratifiedMeadow();

      const instanceBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, instanceData, gl.STATIC_DRAW);

      const stride = FLOATS_PER_INSTANCE * 4;
      // location 1: aRootAndSize (vec4)
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 4, gl.FLOAT, false, stride, 0);
      gl.vertexAttribDivisor(1, 1);

      // location 2: aTraits (vec4)
      gl.enableVertexAttribArray(2);
      gl.vertexAttribPointer(2, 4, gl.FLOAT, false, stride, 4 * 4);
      gl.vertexAttribDivisor(2, 1);

      gl.bindVertexArray(null);

      // -------------------------------------------------------------------------
      // 4. SILKY 2D FLUID-SPRING INTERACTION FIELD (CPU -&gt; GPU FLOAT TEXTURE)
      // -------------------------------------------------------------------------
      // We simulate a 96 x 96 continuous elastic wave-and-spring grid covering the viewport.
      // When the mouse or finger moves, it injects smooth directional momentum into the grid.
      // Neighboring cells diffuse and propagate the wave outward, while spring-damped inertia
      // creates authentic whip-like S-curves and a lingering, affectionate recovery.
      const GRID_W = 96;
      const GRID_H = 96;
      const GRID_CELLS = GRID_W * GRID_H;

      const dispX = new Float32Array(GRID_CELLS);
      const dispY = new Float32Array(GRID_CELLS);
      const velX  = new Float32Array(GRID_CELLS);
      const velY  = new Float32Array(GRID_CELLS);
      const whipZ = new Float32Array(GRID_CELLS); // Captures rapid shear/whip for S-curve inflection
      const glowW = new Float32Array(GRID_CELLS); // Affectionate caress bloom

      // Temp arrays for spatial wave diffusion (neighbor propagation)
      const nextVelX = new Float32Array(GRID_CELLS);
      const nextVelY = new Float32Array(GRID_CELLS);

      // Check support for linear filtering on float textures; fallback to RGBA16F if needed
      gl.getExtension(&#x27;OES_texture_float_linear&#x27;);
      gl.getExtension(&#x27;EXT_color_buffer_float&#x27;);

      const texData = new Float32Array(GRID_CELLS * 4);
      const interactionTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, interactionTex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, GRID_W, GRID_H, 0, gl.RGBA, gl.FLOAT, texData);

      // Pointer tracking state with sub-frame stroke interpolation
      let pointerActive = false;
      let normPtrX = 0.5;
      let normPtrY = 0.5;
      let prevNormPtrX = 0.5;
      let prevNormPtrY = 0.5;
      let smoothVx = 0.0;
      let smoothVy = 0.0;
      let lastInputTime = 0;

      function handlePointerMove(clientX, clientY) {
        const nx = clientX / Math.max(window.innerWidth, 1);
        const ny = 1.0 - (clientY / Math.max(window.innerHeight, 1));
        const now = performance.now();

        if (!pointerActive || (now - lastInputTime &gt; 160)) {
          prevNormPtrX = nx;
          prevNormPtrY = ny;
          smoothVx = 0.0;
          smoothVy = 0.0;
        } else {
          const dt = Math.max(0.004, (now - lastInputTime) * 0.001);
          const vx = (nx - prevNormPtrX) / dt;
          const vy = (ny - prevNormPtrY) / dt;
          smoothVx += (vx - smoothVx) * 0.45;
          smoothVy += (vy - smoothVy) * 0.45;

          // Splat along the continuous segment from prevNormPtr to current (nx, ny)
          splatStrokeSegment(prevNormPtrX, prevNormPtrY, nx, ny, smoothVx, smoothVy);

          prevNormPtrX = nx;
          prevNormPtrY = ny;
        }

        normPtrX = nx;
        normPtrY = ny;
        pointerActive = true;
        lastInputTime = now;
      }

      function splatStrokeSegment(x0, y0, x1, y1, vx, vy) {
        const aspect = window.innerWidth / Math.max(window.innerHeight, 1);
        const dist = Math.hypot((x1 - x0) * aspect, y1 - y0);
        const steps = Math.max(1, Math.min(8, Math.ceil(dist * 45)));

        // Brush radius in normalized UV space
        const radius = 0.145;
        const radiusSq = radius * radius;
        const invRadius = 1.0 / radius;

        // Clamp stroke velocity for silky, organic response
        const clampedVx = Math.max(-2.4, Math.min(2.4, vx * 1.15));
        const clampedVy = Math.max(-2.0, Math.min(2.0, vy * 1.05));
        const speed = Math.hypot(clampedVx, clampedVy);

        for (let s = 1; s &lt;= steps; s++) {
          const t = s / steps;
          const px = x0 + (x1 - x0) * t;
          const py = y0 + (y1 - y0) * t;

          const minGx = Math.max(0, Math.floor((px - radius) * GRID_W));
          const maxGx = Math.min(GRID_W - 1, Math.ceil((px + radius) * GRID_W));
          const minGy = Math.max(0, Math.floor((py - radius) * GRID_H));
          const maxGy = Math.min(GRID_H - 1, Math.ceil((py + radius) * GRID_H));

          for (let gy = minGy; gy &lt;= maxGy; gy++) {
            const cy = (gy + 0.5) / GRID_H;
            const dy = cy - py;

            for (let gx = minGx; gx &lt;= maxGx; gx++) {
              const cx = (gx + 0.5) / GRID_W;
              const dx = (cx - px) * aspect;
              const dSq = dx * dx + dy * dy;

              if (dSq &lt; radiusSq) {
                const d = Math.sqrt(dSq);
                const u = 1.0 - d * invRadius;
                // Smooth quintic falloff for an ultra-soft brush cushion
                const falloff = u * u * u * (u * (u * 6.0 - 15.0) + 10.0);

                const idx = gy * GRID_W + gx;

                // Combine gentle radial parting around the hand/cursor with directional stroke flow
                const radialDirX = dx / (d + 0.015);
                const radialDirY = dy / (d + 0.015);

                const forceX = (clampedVx * 1.65 + radialDirX * 0.55) * falloff;
                const forceY = (clampedVy * 1.25 + radialDirY * 0.35) * falloff;

                velX[idx] += forceX * 0.42;
                velY[idx] += forceY * 0.42;

                // Inject whip curl (creates the S-bend inflection on the upper half of blades)
                whipZ[idx] = Math.max(-1.6, Math.min(1.6, whipZ[idx] + ( -clampedVx * 0.55 + radialDirX * 0.45 ) * falloff * 0.5));
                glowW[idx] = Math.min(1.0, glowW[idx] + falloff * (0.22 + speed * 0.25));
              }
            }
          }
        }
      }

      window.addEventListener(&#x27;mousemove&#x27;, (e) =&gt; {
        handlePointerMove(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener(&#x27;mousedown&#x27;, (e) =&gt; {
        handlePointerMove(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener(&#x27;touchstart&#x27;, (e) =&gt; {
        for (let i = 0; i &lt; e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          handlePointerMove(t.clientX, t.clientY);
        }
      }, { passive: true });

      window.addEventListener(&#x27;touchmove&#x27;, (e) =&gt; {
        for (let i = 0; i &lt; e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          handlePointerMove(t.clientX, t.clientY);
        }
      }, { passive: true });

      // Step the 2D fluid-spring interaction grid every frame
      function stepInteractionField(dt) {
        const now = performance.now();
        // Even if the mouse rests still inside the meadow, gently part the ribbons right under the cursor
        if (pointerActive &amp;&amp; (now - lastInputTime &lt; 350)) {
          splatStrokeSegment(normPtrX, normPtrY, normPtrX, normPtrY, smoothVx * 0.25, smoothVy * 0.25);
        }

        // 1. Spatial wave diffusion: neighboring ribbons share momentum like a connected living fabric
        const diffRate = 0.18;
        for (let y = 1; y &lt; GRID_H - 1; y++) {
          const rowOffset = y * GRID_W;
          for (let x = 1; x &lt; GRID_W - 1; x++) {
            const i = rowOffset + x;
            const avgVx = 0.25 * (velX[i - 1] + velX[i + 1] + velX[i - GRID_W] + velX[i + GRID_W]);
            const avgVy = 0.25 * (velY[i - 1] + velY[i + 1] + velY[i - GRID_W] + velY[i + GRID_W]);
            nextVelX[i] = velX[i] + (avgVx - velX[i]) * diffRate;
            nextVelY[i] = velY[i] + (avgVy - velY[i]) * diffRate;
          }
        }

        // 2. Soft spring-damped integration (silky elastic recovery without rigid snapping)
        const springStiffness = 7.5;
        const damping = Math.exp(-3.4 * dt);
        const whipDecay = Math.exp(-4.2 * dt);
        const glowDecay = Math.exp(-1.25 * dt);

        let tPtr = 0;
        for (let i = 0; i &lt; GRID_CELLS; i++) {
          let vx = nextVelX[i];
          let vy = nextVelY[i];
          let dx = dispX[i];
          let dy = dispY[i];

          // Hooke&#x27;s law spring force pulling displacement gently back to 0
          vx = (vx - dx * springStiffness * dt) * damping;
          vy = (vy - dy * springStiffness * dt) * damping;

          dx += vx * dt * 4.2;
          dy += vy * dt * 4.2;

          // Softly limit maximum displacement so blades arch gracefully
          dx = Math.max(-1.35, Math.min(1.35, dx));
          dy = Math.max(-1.10, Math.min(1.10, dy));

          // Whip curl oscillates slightly as the blade recovers, creating a natural S-wave follow-through
          let wz = (whipZ[i] + (dx * 1.8 - whipZ[i] * 5.0) * dt) * whipDecay;
          let gw = glowW[i] * glowDecay;

          velX[i] = vx;
          velY[i] = vy;
          dispX[i] = dx;
          dispY[i] = dy;
          whipZ[i] = wz;
          glowW[i] = gw;

          texData[tPtr++] = dx;
          texData[tPtr++] = dy;
          texData[tPtr++] = wz;
          texData[tPtr++] = gw;
        }

        // Upload updated fluid-spring field to GPU texture
        gl.bindTexture(gl.TEXTURE_2D, interactionTex);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, GRID_W, GRID_H, gl.RGBA, gl.FLOAT, texData);
      }

      // -------------------------------------------------------------------------
      // 5. RESIZE &amp; CONTINUOUS 60FPS RENDER LOOP
      // -------------------------------------------------------------------------
      let viewportW = window.innerWidth;
      let viewportH = window.innerHeight;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2.0);
        viewportW = Math.floor(window.innerWidth * dpr);
        viewportH = Math.floor(window.innerHeight * dpr);

        if (canvas.width !== viewportW || canvas.height !== viewportH) {
          canvas.width = viewportW;
          canvas.height = viewportH;
          gl.viewport(0, 0, viewportW, viewportH);
        }
      }

      window.addEventListener(&#x27;resize&#x27;, resize, { passive: true });
      resize();

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.clearColor(0.086, 0.015, 0.14, 1.0); // Deepest velvety violet meadow floor

      let lastTime = performance.now();
      let elapsedTime = 0.0;

      function animate(now) {
        const dt = Math.min(0.033, Math.max(0.001, (now - lastTime) * 0.001));
        lastTime = now;
        elapsedTime += dt;

        // 1. Advance the 2D fluid-spring interaction field
        stepInteractionField(dt);

        // 2. Render all 14,400 supple, stratified ribbons in a single instanced draw call
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.useProgram(program);

        gl.uniform2f(uResolutionLoc, viewportW, viewportH);
        gl.uniform1f(uTimeLoc, elapsedTime);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, interactionTex);
        gl.uniform1i(uInteractionTexLoc, 0);

        gl.bindVertexArray(vao);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, stripVertCount, RIBBON_COUNT);
        gl.bindVertexArray(null);

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  &lt;/script&gt;
